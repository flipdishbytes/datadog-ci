name: 'Datadog CI'
description: 'Execute commands from your Continuous Integration (CI) and Continuous Delivery (CD) pipelines to integrate with existing Datadog products.'
inputs:
  DD_SITE:
    description: 'The Datadog site to use. Defaults to us3.datadoghq.com.'
    required: false
    default: 'us3.datadoghq.com'
  COMMAND:
    description: 'The command to execute. e.g. tag --level pipeline --tags service:aws-governance --tags team:de-team --tags env:production'
    required: true
  DATADOG_API_KEY:
    description: 'Datadog API key. Pass the Flipdish Org secret: ${{ secrets.DATADOG_API_KEY }}'
    required: true
  DATADOG_APP_KEY:
    description: 'Datadog application key. Pass the Flipdish Org secret: ${{ secrets.DATADOG_APP_KEY }}'
    required: true

runs:
  using: "composite"
  steps:
    - name: Executing Datadog CI
      continue-on-error: true
      run: |
        export NODE_OPTIONS_BACKUP=$NODE_OPTIONS
        export NODE_OPTIONS=""
        unset NODE_OPTIONS

        if ! which datadog-ci > /dev/null 2>&1; then
              echo "Datadog CI is not installed. Proceeding with installation..."
              if curl -L --fail "https://github.com/DataDog/datadog-ci/releases/latest/download/datadog-ci_linux-x64" --output "/usr/local/bin/datadog-ci"; then
                chmod +x /usr/local/bin/datadog-ci
                echo "Datadog CI has been successfully installed."
                echo "Executing datadog command: ${{ inputs.COMMAND }}"

                /usr/local/bin/datadog-ci ${{ inputs.COMMAND }} || echo "Failed to execute Datadog CI command."
              else
                echo "Failed to install Datadog CI. Please check your installation process."
                exit 1
              fi
        else
              echo "Datadog CI is already installed."
              echo "Executing datadog command: ${{ inputs.COMMAND }}"
              datadog-ci ${{ inputs.COMMAND }} || echo "Failed to execute Datadog CI command."
        fi

        export NODE_OPTIONS=$NODE_OPTIONS_BACKUP
      shell: bash
      env:
          DD_SITE: ${{ inputs.DD_SITE }}
          DATADOG_API_KEY: ${{ inputs.DATADOG_API_KEY }}
          DATADOG_APP_KEY: ${{ inputs.DATADOG_APP_KEY }}
          DD_API_KEY: ${{ inputs.DATADOG_API_KEY }}
          DD_APP_KEY: ${{ inputs.DATADOG_APP_KEY }}
